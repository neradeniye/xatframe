<head>
    <script src="https://unpkg.com/colorthief@3/dist/umd/color-thief.global.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <style type="text/css">
        #mydiv {
            width: 100px;
            height: 100px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <!-- Add crossOrigin="anonymous" to the image tag to avoid CORS errors when fetching images from another domain -->
    <img src="./xatframe/backgrounds/aerith.png" id="myimg" crossorigin="anonymous" />
    <div id="mydiv"></div>

    <script>
      $(window).ready(function(){
        var sourceImage = document.getElementById("myimg");

        // The image must be fully loaded before trying to get its color.
        // The ready event for the window ensures the DOM is loaded, but not necessarily the image asset.
        sourceImage.addEventListener('load', function() {
            // Use the static method getColorSync() directly from the global ColorThief object
            var color = ColorThief.getColorSync(sourceImage);
            document.getElementById("mydiv").style.backgroundColor = "rgb(" + color + ")";
        });
        
        // Handle cases where the image might already be loaded from cache
        if (sourceImage.complete) {
            var color = ColorThief.getColorSync(sourceImage);
            document.getElementById("mydiv").style.backgroundColor = "rgb(" + color + ")";
        }
       });
    </script>
</body>
